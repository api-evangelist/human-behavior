  detail: >-
    Project API key passed to HumanBehaviorTracker.init('YOUR_API_KEY').
  ref: authentication/human-behavior-authentication.yml
ingestion:
  transport: browser-sdk
  config_options:
  - ingestionUrl
  - redactionStrategy
  - redactFields
  detail: >-
    The SDK streams captured session/event data to a configurable ingestion
    endpoint. Redaction is supported via redactionStrategy and redactFields to
    mask sensitive DOM content before transmission.
alternatives:
