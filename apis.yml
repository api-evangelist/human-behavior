name: Human Behavior
description: >-
  Human Behavior Inc. is an AI-powered product analytics platform that uses
  autonomous agents to watch session replays, auto-instrument event tracking,
  map product workflows, and surface friction, bugs, and rage clicks without
  manual instrumentation. Developers integrate it with a first-party JavaScript
  session-recording SDK (humanbehavior-js) that initializes with an API key and
  streams events to the platform's ingestion endpoint, with framework guides for
  React, Next.js, Vue, Svelte, Angular, and more, plus optional PostHog
  ingestion. Backed by $5M from Y Combinator, Vercel, and General Catalyst.
